<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><title>Macroxel</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#eef6fb}#b{height:100%;display:grid;place-items:center;color:#123b5d;font-weight:900}#b i{width:12px;height:12px;border-radius:50%;background:#2563eb;display:inline-block;margin-right:10px;animation:p .8s alternate infinite}@keyframes p{to{opacity:.35;transform:scale(.7)}}</style></head><body><div id="b"><div><i></i>Cargando Macroxel…</div></div><script>(async()=>{const baseUrl='https://raw.githubusercontent.com/janethzarate86-ux/COLECTIVOS-Y-PACIENTES/8aedec22e5232a415a14ea66db354cb985958e3a/index.html';const files=['00','01','02','03','04'].map(x=>'mx_patch/'+x+'.txt?v=100');const rs=await Promise.all([fetch(baseUrl,{cache:'no-store'}),...files.map(x=>fetch(x,{cache:'no-store'}))]);if(rs.some(x=>!x.ok))throw Error('No se pudo cargar la aplicación');let base=await rs[0].text(),b64=(await Promise.all(rs.slice(1).map(x=>x.text()))).join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),patch=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();function apply(src,d){let a=src.split('\n'),o=[],pos=0,ls=d.split('\n'),i=0;while(i<ls.length){let m=ls[i].match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);if(!m){i++;continue}let start=+m[1]-1;while(pos<start)o.push(a[pos++]);i++;while(i<ls.length&&!ls[i].startsWith('@@ ')){let x=ls[i];if(x.startsWith(' '))o.push(a[pos++]??'');else if(x.startsWith('-'))pos++;else if(x.startsWith('+'))o.push(x.slice(1));i++}}while(pos<a.length)o.push(a[pos++]);return o.join('\n')}document.open();document.write(apply(base,patch));document.close()})().catch(e=>document.getElementById('b').innerHTML='<div style="padding:25px;color:#b91c1c">No se pudo iniciar Macroxel.<br><small>'+String(e.message||e)+'</small></div>')</script></body></html>
